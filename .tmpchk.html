<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SVG Editor Studio</title>
<!-- Built from svg-studio/src by svg-studio/build.mjs - edit the modules,
     not this file, then run:  npm run svg:build  -->
<style>
:root{
  --bg:#0d1411; --panel:#131c18; --panel2:#18231e; --panel3:#1e2b25;
  --line:#26352f; --txt:#dcebe3; --dim:#8ba79b; --dim2:#5f7a70;
  --acc:#8ee32a; --acc-d:#1f3a17; --danger:#ff7a7a; --r:7px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);overflow:hidden;
  font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100vh}

/* ---------- top bar ---------- */
header{display:flex;align-items:center;gap:14px;padding:8px 12px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.brand{font-weight:650;letter-spacing:.2px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.brand span{color:var(--dim);font-weight:400;font-size:11px}
.spacer{flex:1}
.tbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{background:var(--panel3);border:1px solid var(--line);border-radius:var(--r);
  padding:5px 10px;cursor:pointer;white-space:nowrap;transition:.12s}
.btn:hover{background:#25352d;border-color:#37493f}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);color:#0d1411;border-color:var(--acc);font-weight:600}
.btn.pri:hover{background:#a2f43c}
.btn.on{background:var(--acc-d);border-color:#3f6b2a;color:var(--acc)}
.btn.icon{padding:5px 8px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.sep{width:1px;height:20px;background:var(--line)}

/* ---------- layout ---------- */
main{flex:1;display:grid;grid-template-columns:232px 1fr 316px;min-height:0}
aside{background:var(--panel);overflow-y:auto;min-height:0}
#leftPane{border-right:1px solid var(--line)}
#rightPane{border-left:1px solid var(--line)}
.sect{border-bottom:1px solid var(--line)}
.sect>h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim2);
  padding:9px 11px 6px;display:flex;align-items:center;gap:6px}
.sect .body{padding:0 11px 11px}

/* ---------- layer tree ---------- */
.layer{display:flex;align-items:center;gap:7px;padding:5px 11px;cursor:pointer;
  border-left:2px solid transparent;user-select:none}
.layer:hover{background:var(--panel2)}
.layer.sel{background:var(--acc-d);border-left-color:var(--acc)}
.layer.child{padding-left:26px;font-size:12px;color:var(--dim)}
.layer.child.sel{color:var(--txt)}
.layer .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatch{width:13px;height:13px;border-radius:3px;border:1px solid #0006;flex:none}
.eye{opacity:.55;font-size:11px;width:16px;text-align:center;flex:none}
.eye.off{opacity:.2}
.layer .mini{opacity:0;font-size:11px;padding:0 3px;border-radius:3px;flex:none}
.layer:hover .mini{opacity:.55}
.layer .mini:hover{opacity:1;background:#0004}

/* ---------- stage ---------- */
#stage{position:relative;background:
   linear-gradient(45deg,#0a100e 25%,transparent 25%,transparent 75%,#0a100e 75%),
   linear-gradient(45deg,#0a100e 25%,#0f1714 25%,#0f1714 75%,#0a100e 75%);
  background-size:22px 22px;background-position:0 0,11px 11px;min-height:0;overflow:hidden}
#art{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#art.panning{cursor:grabbing}
.hud{position:absolute;left:10px;bottom:10px;display:flex;gap:8px;align-items:center;
  background:#0b120fdd;border:1px solid var(--line);border-radius:var(--r);padding:4px 9px;
  font-size:11px;color:var(--dim)}
.hud b{color:var(--txt);font-weight:500;font-variant-numeric:tabular-nums}
#tip{position:absolute;right:10px;bottom:10px;font-size:11px;color:var(--dim2);text-align:right;
  background:#0b120fcc;border-radius:var(--r);padding:5px 8px;pointer-events:none;line-height:1.7}
#tip kbd{background:var(--panel3);border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:10px}

/* handles */
/* colours come from handleTheme() as attributes so they can adapt to the art */
.anchor{cursor:move}
.ctrl{cursor:move}
.anchor:hover,.ctrl:hover{stroke:var(--acc)}
.conn{pointer-events:none}
.ghost{fill:none;stroke:var(--acc);stroke-opacity:.85;pointer-events:none}
.hitp{stroke:transparent;cursor:move}

/* ---------- controls ---------- */
.row{display:flex;align-items:center;gap:8px;margin-top:7px}
.row>label{width:76px;flex:none;color:var(--dim);font-size:11.5px}
.row.wide>label{width:auto}
.grow{flex:1;min-width:0}
input[type=text],input[type=number],select,textarea{
  background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:4px 6px;width:100%}
input[type=number]{font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);background:#16201b}
input[type=range]{width:100%;accent-color:var(--acc);background:none;border:none;padding:0}
input[type=color]{-webkit-appearance:none;appearance:none;width:30px;height:26px;padding:0;
  border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer;flex:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:none;border-radius:3px}
input[type=checkbox]{accent-color:var(--acc);width:14px;height:14px}
.hint{color:var(--dim2);font-size:11px;margin-top:7px;line-height:1.55}
.tabs{display:flex;gap:2px;padding:8px 8px 0}
.tab{flex:1;text-align:center;padding:6px 4px;border-radius:6px 6px 0 0;cursor:pointer;
  color:var(--dim);font-size:11.5px;border:1px solid transparent;border-bottom:none}
.tab.on{background:var(--panel2);color:var(--txt);border-color:var(--line)}
.tabbody{border-top:1px solid var(--line);margin-top:-1px}
.empty{padding:28px 16px;color:var(--dim2);text-align:center;font-size:12px;line-height:1.7}

/* point table */
.pts{width:100%;border-collapse:collapse;margin-top:8px;font-size:11.5px}
.pts th{color:var(--dim2);font-weight:500;font-size:10px;text-transform:uppercase;
  letter-spacing:.6px;padding:0 3px 4px;text-align:left}
.pts td{padding:2px 2px}
.pts input{padding:3px 4px;text-align:right}
.pts select{padding:3px 3px}
.pts .x{cursor:pointer;color:var(--dim2);padding:0 4px;text-align:center}
.pts .x:hover{color:var(--danger)}
.tag{display:inline-block;background:var(--panel3);border-radius:4px;padding:1px 6px;
  font-size:10px;color:var(--dim)}
.gbar{height:24px;border-radius:5px;border:1px solid var(--line);margin-top:7px}
.stop{display:flex;align-items:center;gap:6px;margin-top:6px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 10px;margin-top:9px}
.card>h4{font-size:11.5px;display:flex;align-items:center;gap:6px;color:var(--txt)}

/* ---------- code pane ---------- */
#codePane{flex:none;height:264px;display:flex;flex-direction:column;background:var(--panel);
  border-top:1px solid var(--line)}
#codePane.collapsed{height:37px}
#codePane.collapsed .codeBody{display:none}
.codeHead{display:flex;align-items:center;gap:9px;padding:7px 12px;border-bottom:1px solid var(--line);
  flex:none;cursor:pointer;user-select:none}
.codeHead h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim2)}
.codeModes{display:flex;gap:3px}
.codeModes .btn{padding:2px 9px;font-size:11px;border-radius:5px}
.codeBody{flex:1;overflow:auto;min-height:0}
pre#code{font:11.5px/1.6 ui-monospace,"Cascadia Code",Consolas,monospace;padding:10px 0;
  white-space:pre;tab-size:2}
pre#code .ln{color:#3d5147;user-select:none;display:inline-block;width:46px;text-align:right;
  padding-right:12px}
pre#code .t{color:#7fc7ff}
pre#code .a{color:#8ee32a}
pre#code .v{color:#ffd479}
pre#code .c{color:#4d6459;font-style:italic}
pre#code>span{display:block;min-height:1.6em}
pre#code .hl{background:#8ee32a1c}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--acc);
  color:#0d1411;font-weight:600;padding:8px 16px;border-radius:20px;z-index:99;
  animation:tin .18s;box-shadow:0 6px 20px #0009}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
@media(max-width:1120px){main{grid-template-columns:186px 1fr 270px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">◈ SVG Editor Studio <span>drop an SVG in, edit it, take it back out</span></div>
    <div class="sep"></div>
    <div class="tbar">
      <button class="btn icon" id="bUndo" title="Undo (Ctrl+Z)">↶</button>
      <button class="btn icon" id="bRedo" title="Redo (Ctrl+Shift+Z)">↷</button>
      <div class="sep"></div>
      <button class="btn" id="bHandles" title="Show points for every layer at once">All points</button>
      <button class="btn" id="bSnap" title="Snap coordinates to whole units">Snap</button>
      <button class="btn icon" id="bFit" title="Fit view">⤢ Fit</button>
      <select id="handleMode" class="btn" style="padding:4px 6px;width:auto"
              title="Colour of the bend handles">
        <option value="auto">points: auto</option>
        <option value="dark">points: dark</option>
        <option value="light">points: light</option>
      </select>
      <div class="sep"></div>
      <button class="btn" id="bImport" title="Open any .svg file and edit it here">↥ Open SVG</button>
      <input type="file" id="fileIn" accept=".svg,image/svg+xml" hidden>
    </div>
    <div class="spacer"></div>
    <div class="tbar">
      <button class="btn" id="bReset" title="Back to the sample drawing">Reset</button>
      <button class="btn" id="bCopyHtml" title="Copy the drawing as an HTML page">Copy HTML</button>
      <button class="btn" id="bDownloadHtml" title="Save as a ready-to-open HTML page">↓ HTML</button>
      <button class="btn pri" id="bDownload" title="Save the drawing as an .svg file">↓ Download SVG</button>
    </div>
  </header>

  <main>
    <aside id="leftPane">
      <div class="sect">
        <h3>Layers <span class="spacer"></span><span class="tag" id="layerCount"></span></h3>
        <div id="layers"></div>
      </div>
      <div class="sect">
        <h3>Add</h3>
        <div class="body">
          <div class="row wide"><button class="btn grow" data-add="path">+ Path</button></div>
          <div class="row wide"><button class="btn grow" data-add="line">+ Line in group</button></div>
          <div class="row wide"><button class="btn grow" data-add="group">+ Line group</button></div>
        </div>
      </div>
    </aside>

    <section id="stage">
      <svg id="art" xmlns="http://www.w3.org/2000/svg">
        <defs id="defsHost"></defs>
        <g id="viewport">
          <rect id="bgRect" x="0" y="0" width="500" height="500"></rect>
          <g id="artHost" style="pointer-events:none"></g>
          <g id="hitHost"></g>
          <g id="overlay"></g>
        </g>
      </svg>
      <div class="hud">
        <span>x <b id="hx">–</b></span><span>y <b id="hy">–</b></span>
        <span class="sep"></span><span>zoom <b id="hz">100%</b></span>
      </div>
      <div id="tip">
        drag a <b>point</b> to reshape · drag a <b>shape</b> to move it<br>
        wheel = zoom · drag background = pan · <kbd>↑↓←→</kbd> nudge · <kbd>Esc</kbd> deselect
      </div>
    </section>

    <aside id="rightPane">
      <div class="tabs">
        <div class="tab on" data-tab="el">Element</div>
        <div class="tab" data-tab="grad">Gradients</div>
        <div class="tab" data-tab="doc">Canvas</div>
      </div>
      <div class="tabbody" id="panel"></div>
    </aside>
  </main>

  <section id="codePane">
    <div class="codeHead" id="codeHead">
      <h3 id="codeTitle">▾ Generated code</h3>
      <span class="tag" id="codeStat"></span>
      <div class="codeModes">
        <button class="btn on" id="bModeSvg" title="Show the .svg file">SVG</button>
        <button class="btn" id="bModeHtml" title="Show the HTML page">HTML</button>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="bCopy2">Copy</button>
    </div>
    <div class="codeBody"><pre id="code"></pre></div>
  </section>
</div>
<script>
/* ==== util.js ======================================================= */
/* util.js - tiny shared helpers
   part of SVG Editor Studio - see svg-studio/README.md */

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const clone = o => JSON.parse(JSON.stringify(o));
const num = (v, d = 0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
const r2 = n => Math.round(n * 100) / 100;
const uid = p => p + Math.random().toString(36).slice(2, 7);
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

let toastT = null;
function toast(msg) {
  const old = document.querySelector('.toast'); if (old) old.remove();
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2200);
}

/* ==== model.js ====================================================== */
/* model.js - the drawing as data, plus path maths
   part of SVG Editor Studio - see svg-studio/README.md */


/* ---------------------------------------------------------------- model */
const P = (...n) => { const a = []; for (let i = 0; i < n.length; i += 2) a.push([n[i], n[i + 1]]); return a; };
const seg = (type, ...n) => ({ type, pts: P(...n) });
const Z = () => ({ type: 'Z', pts: [] });

function original() {
  return {
    doc: {
      title: 'Green Leaf Vector',
      pageBg: '#f7fbf8',
      maxWidth: 550,
      viewBox: { x: 0, y: 0, w: 500, h: 500 },
      shadow: { on: true, dx: 0, dy: 8, blur: 16, color: '#00280a', opacity: 0.06 },
      blurStd: 6
    },
    gradients: [
      { id: 'upperBladeGrad', label: 'Upper blade', x1: 0, y1: 100, x2: 80, y2: 0, stops: [
        { off: 0, color: '#5ecf19', op: 1 }, { off: 30, color: '#80e320', op: 1 },
        { off: 65, color: '#a4f134', op: 1 }, { off: 100, color: '#7bd91c', op: 1 } ] },
      { id: 'lowerBladeGrad', label: 'Lower blade', x1: 0, y1: 100, x2: 100, y2: 0, stops: [
        { off: 0, color: '#188615', op: 1 }, { off: 35, color: '#3eb816', op: 1 },
        { off: 75, color: '#6ecb1c', op: 1 }, { off: 100, color: '#83e123', op: 1 } ] },
      { id: 'stemGrad', label: 'Stem', x1: 0, y1: 100, x2: 100, y2: 0, stops: [
        { off: 0, color: '#0e6910', op: 1 }, { off: 100, color: '#1a8915', op: 1 } ] },
      { id: 'midribGrad', label: 'Midrib', x1: 0, y1: 100, x2: 100, y2: 0, stops: [
        { off: 0, color: '#0f6a10', op: 1 }, { off: 40, color: '#248f14', op: 1 },
        { off: 80, color: '#52be19', op: 1 }, { off: 100, color: '#76d81e', op: 1 } ] },
      { id: 'highlightGlow', label: 'Sheen glow', x1: 0, y1: 100, x2: 100, y2: 0, stops: [
        { off: 0, color: '#ffffff', op: 0.6 }, { off: 50, color: '#e2ffaa', op: 0.5 },
        { off: 100, color: '#ffffff', op: 0 } ] }
    ],
    items: [
      { id: 'halo', name: 'White halo', note: 'WHITE OUTER BORDER / GLOW HALO', type: 'path', on: true,
        fill: { mode: 'solid', color: '#ffffff', op: 1 },
        stroke: { mode: 'solid', color: '#ffffff', op: 1 }, w: 12, cap: 'round', join: 'round',
        op: 1, tx: 0, ty: 0, blur: false,
        segs: [ seg('M', 42, 488), seg('C', 62, 468, 82, 445, 110, 420),
                seg('C', 70, 270, 180, 110, 390, 70), seg('C', 360, 310, 230, 450, 110, 420), Z() ] },

      { id: 'stem', name: 'Stem', note: 'LEAF STEM', type: 'path', on: true,
        fill: { mode: 'none' }, stroke: { mode: 'grad', grad: 'stemGrad', op: 1 },
        w: 10, cap: 'round', join: 'round', op: 1, tx: 0, ty: 0, blur: false,
        segs: [ seg('M', 42, 488), seg('C', 62, 468, 85, 442, 115, 415) ] },

      { id: 'lowerBlade', name: 'Lower blade', note: 'LOWER HALF OF LEAF BLADE', type: 'path', on: true,
        fill: { mode: 'grad', grad: 'lowerBladeGrad', op: 1 }, stroke: { mode: 'none' },
        w: 1, cap: 'round', join: 'round', op: 1, tx: 0, ty: 0, blur: false,
        segs: [ seg('M', 110, 420), seg('Q', 235, 260, 390, 70),
                seg('C', 360, 310, 230, 450, 110, 420), Z() ] },

      { id: 'upperBlade', name: 'Upper blade', note: 'UPPER HALF OF LEAF BLADE', type: 'path', on: true,
        fill: { mode: 'grad', grad: 'upperBladeGrad', op: 1 }, stroke: { mode: 'none' },
        w: 1, cap: 'round', join: 'round', op: 1, tx: 0, ty: 0, blur: false,
        segs: [ seg('M', 110, 420), seg('C', 70, 270, 180, 110, 390, 70),
                seg('Q', 235, 260, 110, 420), Z() ] },

      { id: 'sheen', name: 'Sheen highlight', note: 'SOFT LUMINOUS HIGHLIGHT (Upper Blade Sheen)',
        type: 'path', on: true, fill: { mode: 'none' },
        stroke: { mode: 'grad', grad: 'highlightGlow', op: 1 },
        w: 22, cap: 'round', join: 'round', op: 1, tx: 0, ty: 0, blur: true,
        segs: [ seg('M', 125, 405), seg('Q', 210, 265, 330, 135) ] },

      { id: 'veinsLower', name: 'Veins — lower', note: 'SECONDARY VEINS - LOWER HALF', type: 'group', on: true,
        fill: { mode: 'none' }, stroke: { mode: 'solid', color: '#e1ffbe', op: 0.55 },
        w: 2.2, cap: 'round', join: 'round', op: 1, tx: 0, ty: 0, blur: false,
        kids: [
          { id: 'vl1', name: 'Vein L1', on: true, segs: [ seg('M', 155, 365), seg('Q', 200, 392, 248, 408) ] },
          { id: 'vl2', name: 'Vein L2', on: true, segs: [ seg('M', 215, 285), seg('Q', 275, 320, 325, 328) ] },
          { id: 'vl3', name: 'Vein L3', on: true, segs: [ seg('M', 285, 200), seg('Q', 338, 230, 372, 222) ] },
          { id: 'vl4', name: 'Vein L4', on: true, segs: [ seg('M', 340, 132), seg('Q', 370, 150, 386, 138) ] } ] },

      { id: 'veinsUpper', name: 'Veins — upper', note: 'SECONDARY VEINS - UPPER HALF', type: 'group', on: true,
        fill: { mode: 'none' }, stroke: { mode: 'solid', color: '#f0ffd2', op: 0.75 },
        w: 2.4, cap: 'round', join: 'round', op: 1, tx: 0, ty: 0, blur: false,
        kids: [
          { id: 'vu1', name: 'Vein U1', on: true, segs: [ seg('M', 148, 375), seg('Q', 120, 350, 150, 50) ] },
          { id: 'vu2', name: 'Vein U2', on: true, segs: [ seg('M', 202, 302), seg('Q', 196, 232, 232, 178) ] },
          { id: 'vu3', name: 'Vein U3', on: true, segs: [ seg('M', 240, 255), seg('Q', 215, 200, 250, 80) ] },
          { id: 'vu4', name: 'Vein U4', on: true, segs: [ seg('M', 268, 222), seg('Q', 250, 150, 280, 100) ] },
          { id: 'vu5', name: 'Vein U5', on: true, segs: [ seg('M', 332, 142), seg('Q', 342, 112, 362, 90) ] } ] },

      { id: 'midribShadow', name: 'Midrib shadow', note: 'MAIN MIDRIB — base shadow line for depth',
        type: 'path', on: true, fill: { mode: 'none' },
        stroke: { mode: 'solid', color: '#0d5d0e', op: 1 },
        w: 4.5, cap: 'round', join: 'round', op: 0.3, tx: 0.5, ty: 1, blur: false,
        segs: [ seg('M', 110, 420), seg('Q', 200, 230, 390, 70) ] },

      { id: 'midrib', name: 'Midrib', note: 'MAIN MIDRIB — body', type: 'path', on: true,
        fill: { mode: 'none' }, stroke: { mode: 'grad', grad: 'midribGrad', op: 1 },
        w: 3.8, cap: 'round', join: 'round', op: 1, tx: 0, ty: 0, blur: false,
        segs: [ seg('M', 110, 420), seg('Q', 200, 230, 390, 70) ] },

      { id: 'midribLight', name: 'Midrib highlight', note: 'MAIN MIDRIB — top highlight line',
        type: 'path', on: true, fill: { mode: 'none' },
        stroke: { mode: 'solid', color: '#ffffe6', op: 0.65 },
        w: 1.2, cap: 'round', join: 'round', op: 1, tx: 0, ty: 0, blur: false,
        segs: [ seg('M', 112, 418), seg('Q', 200, 230, 388, 71) ] }
    ]
  };
}

/* ------------------------------------------------------------ path math */
const NPTS = { M: 1, L: 1, Q: 2, C: 3, Z: 0 };
function segsToD(segs) {
  return segs.map(s => s.type === 'Z' ? 'Z'
    : s.type + ' ' + s.pts.map(p => r2(p[0]) + ' ' + r2(p[1])).join(' ')).join(' ');
}
/* Full SVG path parser: relative commands, H/V, S/T shorthand and A arcs
   are all normalised into absolute M / L / Q / C / Z segments. */
function parseD(d) {
  const toks = String(d).match(/[astvzqmhlcASTVZQMHLC]|[-+]?[0-9]*\.?[0-9]+(?:[eE][-+]?[0-9]+)?/g) || [];
  const out = []; let i = 0, cmd = '', cur = [0, 0], sub = [0, 0], pC = null, pQ = null;
  const n = () => parseFloat(toks[i++]);
  const put = (t, ...pts) => out.push({ type: t, pts });
  while (i < toks.length) {

/* ==== io.js ========================================================= */
/* io.js - loading a file from disk into the editor
   part of SVG Editor Studio - see svg-studio/README.md */





function loadSVGFile(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    snapshot();
    try {
      const res = importSVGText(String(fr.result));
      commit(); renderAll(); fit();
      toast(res.count + ' shapes imported' + (res.grads ? ', ' + res.grads + ' gradients' : '') +
        (res.skipped ? ' — skipped ' + res.skipped : ''));
    } catch (err) { cancelSnapshot(); toast('Import failed: ' + err.message); }
  };
  fr.onerror = () => { toast('Could not read that file'); };
  fr.readAsText(file);
}

    gradTag(g, pad + '  ').split('\n').forEach(push);

      (tap ? ' (variable width: filled outline)' : '') + ' -->');

        '<span class="x" style="float:right" data-act="delSeg" data-arg="' + si + '" title="Delete segment">✕</span>' +
        '<span class="x" style="float:right" data-act="addSeg" data-arg="' + si + '" title="Add segment after">＋</span>' +
        (sg.type === 'Q' || sg.type === 'C' || sg.type === 'L'
          ? '<span class="x" style="float:right" data-act="splitSeg" data-arg="' + si +
            '" title="Add a point in the middle of this curve (shape is preserved)">◈</span>' : '') +
        '</td></tr>';
      sg.pts.forEach((p, pi) => {
        const role = sg.type === 'M' ? 'start' : (pi === sg.pts.length - 1 ? 'end' :
          (sg.type === 'C' ? 'ctrl ' + (pi + 1) : 'ctrl'));
        h += '<tr' + rowsel + '><td style="color:var(--dim2)">' + role + '</td>' +
          '<td><input type="number" step="1" value="' + r2(p[0]) + '" data-b="' + pb + '.' + si + '.pts.' + pi + '.0" data-t="n"></td>' +
          '<td><input type="number" step="1" value="' + r2(p[1]) + '" data-b="' + pb + '.' + si + '.pts.' + pi + '.1" data-t="n"></td>' +
          '<td colspan="2"></td></tr>';
      });
    });
    h += '</table>';
    h += '<div class="row" style="gap:4px">' +
      '<button class="btn grow" data-act="addSeg" data-arg="-1">+ point at end</button>' +
      '<button class="btn grow" data-act="splitLongest">◈ point in middle</button></div>';
    h += '<div class="hint">Or <b>double-click anywhere on the line</b> on the canvas to drop a new point exactly there.</div>';
    h += '<div class="row wide"><label style="width:auto">path d</label></div>' +
      '<textarea rows="3" spellcheck="false" data-act="setD" style="font:11px ui-monospace,monospace">' +
      esc(segsToD(segs)) + '</textarea>' +
      '<div class="hint">Paste any SVG path here (M / L / Q / C / Z, absolute) and it becomes editable points.</div>';
    h += '</div></div>';
  }

  h += '<div class="sect"><div class="body"><div class="row" style="gap:4px">' +
    '<button class="btn grow" data-act="dupItem">⧉ duplicate layer</button>' +
    '<button class="btn grow" data-act="delItem" style="color:var(--danger)">✕ delete layer</button>' +
    '</div></div></div>';
  return h;
}

/* ------------------------------ panel events ------------------------------ */
const panel = $('#panel');
panel.addEventListener('focusin', e => { if (e.target.matches('input,select,textarea')) snapshot(); });
panel.addEventListener('input', e => {
  const el = e.target, b = el.dataset.b; if (!b) return;
  const t = el.dataset.t;
  if (t === 'seg') {
    snapshot(); convertSeg(getP(b.replace(/\.\d+\.type$/, '')), +el.dataset.arg, el.value); commit();
    renderAll(); return;
  }
  if (t === 'tpct') {                      // width-stop position slider (0-100 -> 0-1)
    const stops = getP(b.replace(/\.\d+\.tPct$/, ''));
    stops[+el.dataset.arg].t = Math.max(0, Math.min(1, num(el.value, 0) / 100));
    renderArt(); renderCode(); return;
  }
  let v = t === 'n' ? num(el.value, 0) : t === 'b' ? el.checked : el.value;
  setP(b, v);
  if (el.dataset.re) { commit(); renderAll(); }
  else {
    // live-sync twins (colour picker <-> hex field, range <-> number)
    $$('#panel [data-b="' + b + '"]').forEach(o => { if (o !== el && o.value !== String(v)) o.value = v; });
    renderArt(); renderCode(); renderLayers();
  }
});
panel.addEventListener('change', e => { if (e.target.dataset.b) { commit(); save(); } });
panel.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  act(btn.dataset.act, btn.dataset.arg);
});
panel.addEventListener('change', e => {
  if (e.target.dataset.act === 'setD') {
    edit(() => {
      const segs = parseD(e.target.value);
      if (sel.k != null) selItem().kids[sel.k].segs = segs; else selItem().segs = segs;
    });
  }
});
$$('.tab').forEach(t => t.addEventListener('click', () => { opts.tab = t.dataset.tab; renderPanel(); }));

/* -------------------------------- actions -------------------------------- */
function act(a, arg) {
  const it = selItem();
  const segsRef = () => (sel.k != null ? it.kids[sel.k] : it);
  switch (a) {
    case 'flipH': case 'flipV': case 'scaleUp': case 'scaleDown': case 'rot': {
      edit(() => {
        const o = segsRef(), bb = bbox(o.segs);
        const cx = (bb.x0 + bb.x1) / 2, cy = (bb.y0 + bb.y1) / 2;
        if (a === 'flipH') mapPath(o.segs, (x, y) => [2 * cx - x, y]);
        if (a === 'flipV') mapPath(o.segs, (x, y) => [x, 2 * cy - y]);
        if (a === 'scaleUp' || a === 'scaleDown') {
          const s = a === 'scaleUp' ? 1.05 : 1 / 1.05;
          mapPath(o.segs, (x, y) => [cx + (x - cx) * s, cy + (y - cy) * s]);
        }
        if (a === 'rot') {
          const t = 15 * Math.PI / 180, co = Math.cos(t), si = Math.sin(t);
          mapPath(o.segs, (x, y) => [cx + (x - cx) * co - (y - cy) * si, cy + (x - cx) * si + (y - cy) * co]);
        }
      });
      break;
    }
    case 'addSeg': edit(() => {
      const o = segsRef(), i = +arg < 0 ? o.segs.length - 1 : +arg;
      const a0 = o.segs[i] && o.segs[i].pts.length ? o.segs[i].pts[o.segs[i].pts.length - 1] : [100, 100];
      const end = [a0[0] + 60, a0[1] - 45];
      o.segs.splice(i + 1, 0, seg('Q', (a0[0] + end[0]) / 2 + 18, (a0[1] + end[1]) / 2 - 18, end[0], end[1]));
      setSelSeg(i + 1);
    }); break;
    case 'delSeg': edit(() => {
      const o = segsRef(); if (o.segs.length <= 2) return toast('A path needs at least two segments');
      o.segs.splice(+arg, 1); if (o.segs[0].type !== 'M') o.segs[0].type = 'M';
      setSelSeg(-1);
    }); break;
    case 'splitSeg': edit(() => {
      const o = segsRef();
      if (!splitSeg(o.segs, +arg, 0.5)) toast('That segment has no middle to split');
      else setSelSeg(+arg);
    }); break;
    case 'splitLongest': edit(() => {
      const o = segsRef();
      let best = -1, bestLen = -1, cur = null;
      o.segs.forEach((s, si) => {
        if (s.type === 'M') { cur = s.pts[0]; return; }
        if (!cur || s.type === 'Z') return;
        const len = ctrlLen([cur].concat(s.pts));
        if (len > bestLen) { bestLen = len; best = si; }
        cur = s.pts[s.pts.length - 1];
      });
      if (best < 0 || !splitSeg(o.segs, best, 0.5)) toast('Nothing to split yet');
      else setSelSeg(best);
    }); break;
    case 'taperOn': edit(() => {
      if (it.taper && it.taper.on) it.taper.on = false;
      else it.taper = it.taper ? Object.assign(it.taper, { on: true }) : defaultTaper(it.w);
    }); break;
    case 'addTaper': edit(() => {
      const s = it.taper.stops;
      s.push({ t: 0.5, w: r2(widthAt(s, 0.5)) });
      s.sort((a2, b2) => a2.t - b2.t);
    }); break;
    case 'delTaper': edit(() => {
      if (it.taper.stops.length <= 2) return toast('Keep at least two width stops');
      it.taper.stops.splice(+arg, 1);
    }); break;
    case 'taperPreset': edit(() => {
      const w = it.w || 3;
      it.taper.stops = arg === 'tip' ? [{ t: 0, w: r2(w * 1.8) }, { t: 1, w: 0 }]
        : arg === 'leaf' ? [{ t: 0, w: 0 }, { t: 0.35, w: r2(w * 2.2) }, { t: 1, w: 0 }]
        : [{ t: 0, w: r2(w) }, { t: 1, w: r2(w) }];
    }); break;
    case 'pickKid': sel.k = +arg; setSelSeg(-1); renderAll(); break;
    case 'addKid': edit(() => { it.kids.push(newLine(it)); sel.k = it.kids.length - 1; }); break;
    case 'dupItem': edit(() => {
      const c = clone(it); c.id = uid('el'); c.name = it.name + ' copy';
      if (c.kids) c.kids.forEach(k => k.id = uid('v'));
      model.items.splice(sel.i + 1, 0, c); setSel({ i: sel.i + 1, k: null });
    }); break;
    case 'delItem': edit(() => {
      if (model.items.length <= 1) return toast('Keep at least one layer');
      model.items.splice(sel.i, 1); setSel({ i: Math.max(0, sel.i - 1), k: null });
    }); break;
    case 'addStop': edit(() => {
      const g = model.gradients[+arg];
      g.stops.push({ off: 100, color: '#ffffff', op: 1 });
      g.stops.sort((a2, b2) => a2.off - b2.off);
    }); break;
    case 'delStop': edit(() => {
      const [gi, si] = arg.split('_').map(Number);
      if (model.gradients[gi].stops.length <= 2) return toast('A gradient needs two stops');
      model.gradients[gi].stops.splice(si, 1);
    }); break;
    case 'addGrad': edit(() => {
      const id = uid('grad');
      model.gradients.push({ id, label: 'New gradient', x1: 0, y1: 100, x2: 100, y2: 0,
        stops: [{ off: 0, color: '#1a8915', op: 1 }, { off: 100, color: '#a4f134', op: 1 }] });
    }); break;
  }
}
function newLine(group) {
  const b = group.kids.length ? bbox(group.kids[group.kids.length - 1].segs) : { x0: 180, y0: 240, x1: 280, y1: 320 };
  const x = b.x0 + 12, y = b.y0 + 30;
  return { id: uid('v'), name: 'Line ' + (group.kids.length + 1), on: true,
    segs: [seg('M', r2(x), r2(y)), seg('Q', r2(x + 40), r2(y - 30), r2(x + 78), r2(y - 52))] };
}

/* ------------------------------ layer events ------------------------------ */
$('#layers').addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.eye !== undefined) {
    const i = +t.dataset.eye;
    edit(() => { if (t.dataset.eyek !== undefined) { const k = model.items[i].kids[+t.dataset.eyek]; k.on = !k.on; } else model.items[i].on = !model.items[i].on; });
    return;
  }
  if (t.dataset.up !== undefined) { const i = +t.dataset.up; if (i > 0) edit(() => { const [m] = model.items.splice(i, 1); model.items.splice(i - 1, 0, m); setSel({ i: i - 1, k: null }); }); return; }
  if (t.dataset.down !== undefined) { const i = +t.dataset.down; if (i < model.items.length - 1) edit(() => { const [m] = model.items.splice(i, 1); model.items.splice(i + 1, 0, m); setSel({ i: i + 1, k: null }); }); return; }
  if (t.dataset.del !== undefined) { setSel({ i: +t.dataset.del, k: null }); act('delItem'); return; }
  if (t.dataset.delk !== undefined) {
    const [i, k] = t.dataset.delk.split('_').map(Number);
    edit(() => { model.items[i].kids.splice(k, 1); setSel({ i, k: null }); }); return;
  }
  if (t.dataset.dupk !== undefined) {
    const [i, k] = t.dataset.dupk.split('_').map(Number);
    edit(() => { const c = clone(model.items[i].kids[k]); c.id = uid('v'); c.name += ' copy';
      movePath(c.segs, 8, 8); model.items[i].kids.splice(k + 1, 0, c); setSel({ i, k: k + 1 }); }); return;
  }
  const row = t.closest('.layer'); if (!row) return;
  setSel({ i: +row.dataset.i, k: row.dataset.k !== undefined ? +row.dataset.k : null });
  setSelSeg(-1); opts.tab = 'el'; renderAll();
});

/* ==== interaction.js ================================================ */
/* interaction.js - pointer, wheel, keyboard and drag-and-drop
   part of SVG Editor Studio - see svg-studio/README.md */









/* ------------------------------ canvas events ------------------------------ */
let drag = null;

function toUser(e) {
  const pt = art.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(vp.getScreenCTM().inverse());
}
function toSvgPx(e) {
  const pt = art.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(art.getScreenCTM().inverse());
}
const snapV = v => opts.snap ? Math.round(v) : r2(v);

art.addEventListener('pointerdown', e => {
  art.setPointerCapture(e.pointerId);
  const handle = e.target.closest('circle[data-s]');
  const wHandle = e.target.closest('[data-w]');
  const shape = e.target.closest('.hitp');
  const u = toUser(e);

  /* width handle: this stop only, so one end can grow while the other shrinks */
  if (wHandle) {
    const it = selItem();
    const holder = it.type === 'group' ? it.kids[sel.k != null ? sel.k : 0] : it;
    if (it && holder && it.taper) {
      snapshot();
      drag = { kind: 'width', it, holder, si: +wHandle.dataset.w,
               t0: it.taper.stops[+wHandle.dataset.w].t };
      return;
    }
  }

  if (handle) {
    const i = +handle.dataset.i, k = handle.dataset.k !== undefined ? +handle.dataset.k : null;
    setSel({ i, k }); setSelSeg(+handle.dataset.s); opts.tab = 'el';
    snapshot();
    const it = model.items[i];
    const segs = k != null ? it.kids[k].segs : it.segs;
    const si = +handle.dataset.s, pi = +handle.dataset.p, sg = segs[si];
    const isAnchor = sg.type === 'M' || pi === sg.pts.length - 1;
    const linked = [];
    if (isAnchor && !e.altKey) {
      // drag the handles attached to this anchor along with it
      if (sg.type !== 'M') sg.pts.slice(0, -1).forEach(p => linked.push(p));
      const nx = segs[si + 1];
      if (nx && (nx.type === 'Q' || nx.type === 'C')) linked.push(nx.pts[0]);
    }
    drag = { kind: 'pt', segs, p: sg.pts[pi], linked, start: u,
      orig: [sg.pts[pi][0], sg.pts[pi][1]], origL: linked.map(p => [p[0], p[1]]) };
    renderAll(); return;
  }
  if (shape) {
    const i = +shape.dataset.i, k = shape.dataset.k !== undefined ? +shape.dataset.k : null;
    if (sel.i !== i || sel.k !== k) { setSel({ i, k }); setSelSeg(-1); opts.tab = 'el'; renderAll(); }
    snapshot();
    const it = model.items[i];
    const segs = k != null ? it.kids[k].segs : it.segs;
    drag = { kind: 'shape', segs, start: u, orig: allPts(segs).map(({ p }) => [p[0], p[1]]) };
    return;
  }
  drag = { kind: 'pan', start: toSvgPx(e), ox: view.x, oy: view.y, moved: false };
  art.classList.add('panning');
});

art.addEventListener('pointermove', e => {
  const u = toUser(e);
  $('#hx').textContent = Math.round(u.x); $('#hy').textContent = Math.round(u.y);
  if (!drag) return;
  if (drag.kind === 'pan') {
    const s = toSvgPx(e);
    view.x = drag.ox + (s.x - drag.start.x); view.y = drag.oy + (s.y - drag.start.y);
    drag.moved = true; renderArt(); return;
  }
  if (drag.kind === 'width') {
    const it = drag.it, st = it.taper.stops[drag.si];
    const res = widthFromDrag(drag.holder.segs, drag.t0,
      [u.x - (it.tx || 0), u.y - (it.ty || 0)]);
    if (res) {
      st.w = opts.snap ? Math.round(res.w) : Math.round(res.w * 10) / 10;
      // sliding along the line re-positions the stop, but the two ends stay put
      const isEnd = drag.si === 0 || drag.si === it.taper.stops.length - 1;
      if (!isEnd) st.t = Math.max(0, Math.min(1, drag.t0 + res.dt));
    }
    renderArt(); renderCode(); return;
  }
  let dx = u.x - drag.start.x, dy = u.y - drag.start.y;
  if (e.shiftKey) { if (Math.abs(dx) > Math.abs(dy)) dy = 0; else dx = 0; }
  if (drag.kind === 'pt') {
    drag.p[0] = snapV(drag.orig[0] + dx); drag.p[1] = snapV(drag.orig[1] + dy);
    drag.linked.forEach((p, i) => { p[0] = snapV(drag.origL[i][0] + dx); p[1] = snapV(drag.origL[i][1] + dy); });
  } else {
    allPts(drag.segs).forEach(({ p }, i) => { p[0] = snapV(drag.orig[i][0] + dx); p[1] = snapV(drag.orig[i][1] + dy); });
  }
  renderArt(); renderCode();
});

art.addEventListener('pointerup', e => {
  art.classList.remove('panning');
  if (!drag) return;
  if (drag.kind === 'pan') { if (!drag.moved) { setSel({ i: sel.i, k: null }); setSelSeg(-1); } cancelSnapshot(); }
  else { commit(); renderPanel(); }
  drag = null; renderCode();
});
art.addEventListener('pointercancel', () => { drag = null; cancelSnapshot(); art.classList.remove('panning'); });

/* double-click a line to insert a point exactly where you clicked */
art.addEventListener('dblclick', e => {
  const shape = e.target.closest('.hitp');
  if (!shape) return;
  e.preventDefault();
  const i = +shape.dataset.i, k = shape.dataset.k !== undefined ? +shape.dataset.k : null;
  const it = model.items[i];
  const holder = k != null ? it.kids[k] : it;
  const u = toUser(e);
  const pt = [u.x - (it.tx || 0), u.y - (it.ty || 0)];
  const hit = nearestOnPath(holder.segs, pt);
  if (hit.si < 0) return toast('Could not find a spot on that line');
  setSel({ i, k }); opts.tab = 'el';
  edit(() => { if (splitSeg(holder.segs, hit.si, hit.t)) setSelSeg(hit.si); });
  toast('Point added mid-curve');
});

/* drop an .svg file anywhere on the canvas to load it */
['dragenter', 'dragover'].forEach(ev => $('#stage').addEventListener(ev, e => {
  e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
}));
$('#stage').addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  if (!/\.svg$/i.test(f.name) && f.type !== 'image/svg+xml') return toast('Drop an .svg file');
  if (!confirm('Replace the current drawing with ' + f.name + '?')) return;
  loadSVGFile(f);
});

art.addEventListener('wheel', e => {
  e.preventDefault();
  const s = toSvgPx(e);
  const k = Math.exp(-e.deltaY * 0.0015);
  const z2 = Math.min(12, Math.max(0.15, view.z * k));
  view.x = s.x - (s.x - view.x) * (z2 / view.z);
  view.y = s.y - (s.y - view.y) * (z2 / view.z);
  view.z = z2; renderArt();
}, { passive: false });


/* -------------------------------- keyboard -------------------------------- */
addEventListener('keydown', e => {
  const typing = /input|textarea|select/i.test(document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault(); e.shiftKey ? redo() : undo(); return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (typing) return;
  if (e.key === 'Escape') { sel.k = null; setSelSeg(-1); renderAll(); return; }
  if (e.key.startsWith('Arrow')) {
    e.preventDefault();
    const d = e.shiftKey ? 10 : 1;
    const dx = e.key === 'ArrowRight' ? d : e.key === 'ArrowLeft' ? -d : 0;
    const dy = e.key === 'ArrowDown' ? d : e.key === 'ArrowUp' ? -d : 0;
    const o = sel.k != null ? selItem().kids[sel.k] : selItem();
    if (o) edit(() => movePath(o.segs, dx, dy));
  }
});

/* ------------------------- copying and downloading ------------------------- */
function copyCode(mode) {
  const kind = mode === 'html' ? 'HTML' : 'SVG';
  const t = codeText(mode);
  const done = () => toast(kind + ' copied to the clipboard');
  navigator.clipboard.writeText(t).then(done).catch(() => {
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); done();
  });
}
function download(mode) {
  const name = slugName(mode);
  const blob = new Blob([codeText(mode)],
    { type: mode === 'html' ? 'text/html' : 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(name + ' downloaded');
}
$('#bDownload').onclick = () => download('svg');
$('#bDownloadHtml').onclick = () => download('html');
$('#bCopyHtml').onclick = () => copyCode('html');
/* the pane's own Copy follows whichever tab is showing */
$('#bCopy2').onclick = e => { e.stopPropagation(); copyCode(opts.codeMode); };

function setCodeMode(mode) {
  opts.codeMode = mode;
  $('#bModeSvg').classList.toggle('on', mode === 'svg');
  $('#bModeHtml').classList.toggle('on', mode === 'html');
  renderCode();
}
$('#bModeSvg').onclick = e => { e.stopPropagation(); setCodeMode('svg'); };
$('#bModeHtml').onclick = e => { e.stopPropagation(); setCodeMode('html'); };

$('#codeHead').onclick = () => {
  const p = $('#codePane'); p.classList.toggle('collapsed');
  $('#codeTitle').textContent = (p.classList.contains('collapsed') ? '▸' : '▾') + ' Generated code';
};
$$('[data-add]').forEach(b => b.onclick = () => {
  const kind = b.dataset.add;
  edit(() => {
    if (kind === 'line') {
      // into the selected group, else the first group in the drawing
      let gi = sel.i;
      if (!model.items[gi] || model.items[gi].type !== 'group') {
        gi = model.items.findIndex(x => x.type === 'group');
      }
      if (gi < 0) return toast('No line group yet — add one first');
      const g = model.items[gi];
      g.kids.push(newLine(g)); setSel({ i: gi, k: g.kids.length - 1 });
    } else if (kind === 'group') {
      const g = { id: uid('grp'), name: 'Line group', note: 'LINE GROUP', type: 'group', on: true,
        fill: { mode: 'none' }, stroke: { mode: 'solid', color: '#e6ffc8', op: 0.6 },
        w: 2.2, cap: 'round', join: 'round', op: 1, tx: 0, ty: 0, blur: false, kids: [] };
      g.kids.push(newLine(g));
      model.items.push(g); setSel({ i: model.items.length - 1, k: 0 });
    } else {
      model.items.push({ id: uid('el'), name: 'New path', note: 'CUSTOM PATH', type: 'path', on: true,
        fill: { mode: 'none' }, stroke: { mode: 'solid', color: '#ffffff', op: 0.9 },
        w: 3, cap: 'round', join: 'round', op: 1, tx: 0, ty: 0, blur: false,
        segs: [seg('M', 160, 340), seg('C', 200, 280, 260, 230, 320, 190)] });
      setSel({ i: model.items.length - 1, k: null });
    }
    opts.tab = 'el';
  });
});

<script>
(function(){
  const R=[]; const ok=(n,c,x)=>R.push((c?'PASS':'FAIL')+' | '+n+(x?' | '+x:''));
  try {
    // --- SVG export ---
    const svg = codeText('svg');
    const d1 = new DOMParser().parseFromString(svg, 'image/svg+xml');
    ok('svg export parses as real SVG', !d1.querySelector('parsererror'),
       (d1.querySelector('parsererror')||{textContent:''}).textContent.slice(0,60));
    const root = d1.documentElement;
    ok('svg root has namespace + viewBox',
       root.tagName === 'svg' && root.getAttribute('xmlns') === 'http://www.w3.org/2000/svg' &&
       root.getAttribute('viewBox') === '0 0 500 500', root.getAttribute('viewBox'));
    ok('svg export keeps every shape', d1.querySelectorAll('path').length === 17,
       d1.querySelectorAll('path').length + ' paths');
    ok('svg export keeps gradients', d1.querySelectorAll('linearGradient').length === 5);
    ok('svg export carries the drop shadow as a real filter',
       !!d1.querySelector('feDropShadow') && /url\(#artShadow\)/.test(svg));
    ok('svg export declares xml prolog', svg.trim().startsWith('<?xml'));

    // --- HTML export still works ---
    const html = codeText('html');
    const d2 = new DOMParser().parseFromString(html, 'text/html');
    ok('html export still parses', d2.querySelectorAll('svg path').length === 17,
       d2.querySelectorAll('svg path').length + ' paths');
    ok('html export uses the generic card class', /art-card/.test(html) && !/leaf-card/.test(html));

    // --- both agree on geometry ---
    const svgD = [...d1.querySelectorAll('path')].map(p => p.getAttribute('d')).join('|');
    const htmD = [...d2.querySelectorAll('svg path')].map(p => p.getAttribute('d')).join('|');
    ok('svg and html contain identical path data', svgD === htmD);

    // --- filenames ---
    ok('download name from title', slugName('svg') === 'green-leaf-vector.svg' &&
       slugName('html') === 'green-leaf-vector.html', slugName('svg') + ' / ' + slugName('html'));

    // --- round trip: export then re-import ---
    const res = importSVGText(svg);
    ok('exported svg can be re-imported', res.count === 17, res.count + ' shapes back');
    ok('re-import keeps the viewBox', model.doc.viewBox.w === 500);

    // --- no leaf-specific branding left in the UI ---
    const ui = document.body.innerHTML;
    ok('app is no longer branded as a leaf tool', !/Leaf Studio/i.test(ui) && /SVG Editor Studio/.test(ui));
    ok('code pane offers both modes', !!document.getElementById('bModeSvg') && !!document.getElementById('bModeHtml'));
    ok('toolbar offers svg + html download', !!document.getElementById('bDownload') &&
       !!document.getElementById('bDownloadHtml') && !!document.getElementById('bCopyHtml'));
  } catch(e){ R.push('FAIL | THREW | '+e.message+' | '+(e.stack||'').split(String.fromCharCode(10))[1]); }
  const f=R.filter(r=>r.startsWith('FAIL')).length;
  const d=document.createElement('div'); d.textContent='TEST-RESULTS '+(R.length-f)+'/'+R.length+' passed';
  document.body.appendChild(d);
  R.forEach(r=>{const x=document.createElement('div');x.textContent='TEST| '+r;document.body.appendChild(x);});
})();
</script>
